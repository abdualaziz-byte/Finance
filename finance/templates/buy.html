{% extends "layout.html" %}

{% block title %}
    buy shares
{% endblock %}
{% block main %}
    <form action="/buy" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="symbol" placeholder="Stock symbol" type="text">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="amount" placeholder="amount of shares" type="number" min="1" step="1">
        </div>

        <button class="btn btn-primary" type="submit">buy</button>
    </form>
{% endblock %}
